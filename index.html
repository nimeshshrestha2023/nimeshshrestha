<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeWithMe - Maintenance</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #0f0f0f, #1a1a2e);
  color: white;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
  max-width: 500px;
  padding: 20px;
}

.icon {
  font-size: 60px;
  margin-bottom: 20px;
  animation: float 2s ease-in-out infinite;
}

h1 {
  font-size: 40px;
  margin-bottom: 10px;
}

h2 {
  color: #a855f7;
  margin-bottom: 20px;
}

p {
  color: #cccccc;
  line-height: 1.6;
  margin-bottom: 20px;
}

.small {
  font-size: 14px;
  color: #888;
}

#countdown {
  font-size: 20px;
  margin-bottom: 20px;
  color: #fff;
  font-weight: bold;
}

.contact {
  font-size: 13px;
  color: #777;
  margin-top: 20px;
}

/* Loader */
.loader {
  width: 40px;
  height: 40px;
  border: 4px solid #444;
  border-top: 4px solid #a855f7;
  border-radius: 50%;
  margin: 20px auto;
  animation: spin 1s linear infinite;
}

/* Animations */
@keyframes spin {
  100% { transform: rotate(360deg); }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
  </style>
</head>

<body>
  <div class="container">

    <!-- Icon -->
    <div class="icon">🛠️</div>

    <!-- Title -->
    <h1>CodeWithMe</h1>

    <h2>We’ll Be Back Soon</h2>

    <!-- Message -->
    <p>
      We are currently performing maintenance to improve your learning experience.
      New features and improvements are on the way.
    </p>

    <!-- Loader -->
    <div class="loader"></div>

    <!-- Countdown -->
    <p class="small">Time remaining:</p>
    <div id="countdown">Loading...</div>

    <!-- Contact -->
    <p class="contact">
      Need help? support@codewithme.com
    </p>

  </div>

  <script>
    // Set maintenance end time (change this if needed)
let endTime = new Date();
endTime.setMinutes(endTime.getMinutes() + 30); // 30 min countdown

function updateCountdown() {
  let now = new Date().getTime();
  let distance = endTime - now;

  if (distance <= 0) {
    document.getElementById("countdown").innerHTML = "We're back online!";
    return;
  }

  let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  let seconds = Math.floor((distance % (1000 * 60)) / 1000);

  document.getElementById("countdown").innerHTML =
    minutes + "m " + seconds + "s";
}

// update every second
setInterval(updateCountdown, 1000);
updateCountdown();
  </script>
  
</body>
</html>
